<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111315"><title>V12 — Футбольный журнал</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#101214;color:#f2f3f4}*{box-sizing:border-box}body{margin:0;padding-bottom:85px}header{background:#191b1d;border-bottom:3px solid #fa791b;padding:15px max(18px,calc((100vw - 1050px)/2));display:flex;align-items:center;gap:14px}.logo{width:58px;height:58px;object-fit:contain;border-radius:12px;background:#242424}.brand{font-size:26px;font-weight:900}.sub{font-size:12px;color:#aaa}main{max-width:1050px;margin:auto;padding:22px 15px}.muted{color:#a7aaad}.small{font-size:13px}.pill{display:inline-block;border:1px solid #424548;border-radius:30px;padding:5px 10px;color:#ff9b4c;font-size:12px}.card{background:#1b1e20;border:1px solid #33383b;border-radius:18px;padding:20px;margin:14px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:12px}.metric{padding:18px;border-radius:16px;background:#202427;border:1px solid #383c40}.metric b{font-size:29px;display:block;color:#ff9a4a}h1,h2,h3{margin:0 0 14px}h2{font-size:24px}h3{font-size:18px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}.top{margin-top:15px}button{cursor:pointer;font:inherit;border:0;border-radius:11px;padding:11px 15px;font-weight:700;background:#33383b;color:#fff}button.primary{background:#f47721;color:#141414}button.danger{background:#812d2d}button:disabled{opacity:.5;cursor:not-allowed}input,select{width:100%;border:1px solid #454a4e;border-radius:10px;background:#111517;color:#fff;padding:12px;font:inherit;min-width:0}label{display:block;font-size:13px;color:#c9cdd0;margin:12px 0 6px}form .grid{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}table{border-collapse:collapse;width:100%;min-width:450px}td,th{padding:11px 9px;text-align:left;border-bottom:1px solid #383b3e;font-size:14px}th{color:#b8bdc0}.scroll{overflow:auto}.nav{position:fixed;bottom:0;left:0;right:0;z-index:10;background:#1b1e20;border-top:1px solid #444;display:flex;justify-content:center;gap:4px;padding:9px 5px max(9px,env(safe-area-inset-bottom))}.nav button{background:none;padding:8px 10px;font-size:12px;color:#bbb}.nav button.active{color:#ff8a31;background:#303030}.hidden{display:none!important}.notice{background:#3b2c20;border:1px solid #a56732;border-radius:12px;padding:13px;margin:10px 0}.error{color:#ffaaa0}.avatar{width:45px;height:45px;border-radius:50%;object-fit:cover;background:#373c40}.avatar.big{width:90px;height:90px}.field{position:relative;aspect-ratio:1/1.24;max-width:510px;margin:15px auto;background:repeating-linear-gradient(0deg,#174c35 0 18%,#1b563c 18% 36%);border:3px solid #b5c5b8;border-radius:8px;overflow:hidden}.field:before{content:"";position:absolute;inset:0;border:2px solid #c8dbce;pointer-events:none}.field:after{content:"";position:absolute;left:30%;top:40%;width:40%;aspect-ratio:1;border:2px solid #b5c5b8;border-radius:50%;pointer-events:none}.midline{position:absolute;top:50%;left:0;right:0;border-top:2px solid #b5c5b8}.pitch-player{position:absolute;transform:translate(-50%,-50%);width:88px;text-align:center;z-index:2}.pitch-player img{width:38px;height:38px;object-fit:cover;border-radius:50%;border:2px solid #f47721}.pitch-player .name{display:block;background:#111c;border-radius:6px;padding:2px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pitch-player .rating{font-size:11px;color:#ffd1a3}.split{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:15px}.chip{display:inline-block;background:#353a3c;padding:7px 10px;border-radius:12px;margin:4px}.linklike{cursor:pointer;color:#ff9c52;text-decoration:underline}.empty{padding:25px;text-align:center;color:#a5a5a5}.wide{width:100%}@media(max-width:500px){header{padding:12px}.brand{font-size:21px}.card{padding:14px}.nav button{font-size:11px;padding:8px 6px}.pitch-player{width:65px}.pitch-player img{width:30px;height:30px}}
</style></head><body><header><img id="brandLogo" class="logo" src="logo.png" alt="V12" onerror="this.style.display='none'"><div><div class="brand">V12 <span style="color:#fa791b">FOOTBALL</span></div><div class="sub">Игровые дни · составы · рейтинги · статистика</div></div><span id="authState" class="pill" style="margin-left:auto">Просмотр</span></header><main><div id="notice"></div><div id="view"></div></main><nav class="nav" id="nav"><button data-tab="days">⚽ Игры</button><button data-tab="stats">📊 Статистика</button><button data-tab="players">👤 Игроки</button><button data-tab="admin">⚙️ Админ</button></nav><script type="module">
const URL='https://wrqmxihqfbalciuymlqc.supabase.co',KEY='sb_publishable_OFoUkkgkJCCzrjI9-IrgTQ_IdTAwUir';
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let db,user=null,admin=false,tab='days',page=null,days=[],dayTeams=[],dayMatches=[],teams=[],players=[],matches=[],events=[],lineups=[],photos=[],admins=[];
const today=()=>new Date().toLocaleDateString('en-CA');const date=s=>s?new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric'}):'';
const by=(arr,id)=>arr.find(x=>x.id===id)||{};const tn=id=>by(teams,id).name||'Команда';const pn=id=>by(players,id).name||'Игрок';
const sel=(arr,selected,placeholder='Выбрать')=>`<option value="">${esc(placeholder)}</option>`+arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');
const error=e=>{console.error(e);$('#notice').innerHTML=`<div class="notice error">${esc(e?.message||e)}</div>`;window.scrollTo(0,0)};
const msg=s=>{$('#notice').innerHTML=`<div class="notice">${esc(s)}</div>`;setTimeout(()=>{if($('#notice'))$('#notice').innerHTML=''},4500)};
async function query(table){const {data,error}=await db.from(table).select('*').limit(10000);if(error)throw new Error(`${table}: ${error.message}`);return data||[]}
async function load(){const data=await Promise.all([query('teams'),query('players'),query('matches'),query('events'),query('v12_matchdays'),query('v12_day_teams'),query('v12_day_matches'),query('v12_lineups'),query('v12_player_photos')]);[teams,players,matches,events,days,dayTeams,dayMatches,lineups,photos]=data;render()}
async function save(table,obj,id,col='id'){if(!admin)throw Error('Требуются права администратора');const q=db.from(table);const {data,error}=id?await q.update(obj).eq(col,id).select():await q.insert(obj).select();if(error)throw error;return data?.[0]}
async function del(table,col,id){if(!admin)throw Error('Нет прав администратора');const {error}=await db.from(table).delete().eq(col,id);if(error)throw error}
async function auth(){const {data,error}=await db.auth.getUser();if(error)console.warn(error);user=data?.user||null;admin=false;if(user){const r=await db.rpc('is_v12_admin');if(r.error)console.warn('Admin RPC',r.error);admin=r.data===true}$('#authState').textContent=admin?'Администратор':user?'Участник':'Просмотр';render()}
function nav(t){tab=t;page=null;$('#notice').innerHTML='';render()}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#view').innerHTML=page?renderPage():tab==='days'?renderDays():tab==='stats'?renderStats():tab==='players'?renderPlayers():renderAdmin()}
function renderDays(){const sorted=[...days].sort((a,b)=>b.play_date.localeCompare(a.play_date));return `<div class="row between"><h2>Игровые дни</h2>${admin?'<button class="primary" data-act="newday">+ Новый игровой день</button>':''}</div>${sorted.length?sorted.map(d=>{const dt=dayTeams.filter(x=>x.matchday_id===d.id),dm=dayMatches.filter(x=>x.matchday_id===d.id);return `<div class="card"><div class="row between"><div><h3>${esc(d.title||'Футбол')} · ${date(d.play_date)}</h3><span class="pill">${dt.length} команды · ${dm.length} матчей</span></div><button data-act="day" data-id="${d.id}">Открыть →</button></div><p class="muted">${dt.map(x=>tn(x.team_id)).map(esc).join(' · ')||'Команды пока не выбраны'}</p></div>`}).join(''):'<div class="card empty">Пока нет игровых дней. Начните с новой игры — статистика будет считаться с нуля.</div>'}`}
function renderPage(){if(page.type==='newday')return `<h2>Новый игровой день</h2><div class="card"><form id="dayForm"><label>Дата</label><input type="date" name="play_date" value="${today()}" required><label>Название</label><input name="title" value="Футбол V12" maxlength="100" required><label>Сколько команд?</label><select name="format"><option value="2">2 команды</option><option value="3">3 команды — на вылет</option></select><button class="primary top">Создать</button><button type="button" data-act="back">Отмена</button></form></div>`;
if(page.type==='day')return renderDay(page.id);if(page.type==='match')return renderMatch(page.id);if(page.type==='player')return renderPlayer(page.id);return ''}
function renderDay(id){const d=days.find(x=>x.id===id);if(!d)return '<p>Игровой день не найден</p>';const dt=dayTeams.filter(x=>x.matchday_id===id),dm=dayMatches.filter(x=>x.matchday_id===id).sort((a,b)=>a.match_order-b.match_order);const ids=dt.map(x=>x.team_id);const standings=ids.map(tid=>{let p=0,w=0,draw=0,goals=0,against=0;for(const x of dm){const m=matches.find(y=>y.id===x.match_id);if(!m||m.status!=='finished'||![m.team_a,m.team_b].includes(tid))continue;p++;const a=m.team_a===tid;const gf=a?m.score_a:m.score_b,ga=a?m.score_b:m.score_a;goals+=gf;against+=ga;if(gf>ga)w++;else if(gf===ga)draw++}return {tid,p,w,draw,goals,against,pts:3*w+draw}}).sort((a,b)=>b.pts-a.pts||(b.goals-b.against)-(a.goals-a.against));return `<div class="row between"><h2>${esc(d.title||'Игровой день')} · ${date(d.play_date)}</h2><button data-act="back">← Игры</button></div><div class="card"><h3>Команды (${dt.length}/${d.format})</h3><div>${dt.map(x=>`<span class="chip">${esc(tn(x.team_id))} ${admin?`<button data-act="removeteam" data-id="${x.id}" style="padding:3px">×</button>`:''}</span>`).join('')}</div>${admin&&dt.length<Number(d.format)?`<form id="addDayTeam"><input type="hidden" name="matchday_id" value="${id}"><label>Добавить команду</label><select name="team_id" required>${sel(teams.filter(t=>!ids.includes(t.id)))}</select><button class="primary top">Добавить</button></form>`:''}<p class="small muted">${d.format==='3'?'Три команды: проигравшая уходит на замену, при ничьей уходит та, что играла дольше. Победа — 3, ничья — 1, поражение — 0.':'Две команды: обычные матчи.'}</p></div><div class="card"><div class="row between"><h3>Матчи</h3>${admin&&dt.length>=2?`<button class="primary" data-act="newmatch" data-id="${id}">+ Матч</button>`:''}</div>${dm.length?dm.map((x,i)=>{const m=matches.find(y=>y.id===x.match_id);return m?`<div class="row between" style="border-bottom:1px solid #383b3e;padding:13px 0"><div><b>№${i+1}: ${esc(tn(m.team_a))} ${m.score_a??0} : ${m.score_b??0} ${esc(tn(m.team_b))}</b><div class="small muted">${m.status==='finished'?'Завершён':'Идёт игра'}</div></div><button data-act="match" data-id="${m.id}">Составы / счёт</button></div>`:''}).join(''):'<div class="empty">Матчей пока нет</div>'}</div><div class="card scroll"><h3>Таблица дня</h3><table><thead><tr><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>ЗМ</th><th>ПМ</th><th>Очки</th></tr></thead><tbody>${standings.map(s=>`<tr><td>${esc(tn(s.tid))}</td><td>${s.p}</td><td>${s.w}</td><td>${s.draw}</td><td>${s.goals}</td><td>${s.against}</td><td><b>${s.pts}</b></td></tr>`).join('')}</tbody></table></div>`}
function renderMatch(id){const m=matches.find(x=>x.id===id);if(!m)return 'Матч не найден';const link=dayMatches.find(x=>x.match_id===id);const ds=link?.matchday_id;return `<div class="row between"><h2>${esc(tn(m.team_a))} ${m.score_a??0} : ${m.score_b??0} ${esc(tn(m.team_b))}</h2><button data-act="day" data-id="${ds||''}">← День</button></div><div class="card"><span class="pill">${m.status==='finished'?'Завершён':'Идёт игра'}</span>${admin?`<form id="scoreForm"><input type="hidden" name="id" value="${id}"><div class="grid"><div><label>Счёт ${esc(tn(m.team_a))}</label><input name="score_a" type="number" min="0" value="${m.score_a??0}" required></div><div><label>Счёт ${esc(tn(m.team_b))}</label><input name="score_b" type="number" min="0" value="${m.score_b??0}" required></div><div><label>Статус</label><select name="status"><option value="live" ${m.status==='live'?'selected':''}>Идёт игра</option><option value="finished" ${m.status==='finished'?'selected':''}>Завершён</option></select></div></div><button class="primary top">Сохранить счёт</button></form>`:''}</div><div class="split">${[m.team_a,m.team_b].map(tid=>renderLineup(m,tid)).join('')}</div><div class="card"><h3>Голы и передачи</h3>${events.filter(e=>e.match_id===id).map(e=>`<div class="row between" style="padding:8px;border-bottom:1px solid #333">${esc(pn(e.player_id))} · ${esc(tn(e.team_id))} · ${e.type==='goal'?'⚽ Гол':'🅰️ Передача'} ${admin?`<button data-act="deleteevent" data-id="${e.id}">×</button>`:''}</div>`).join('')||'<p class="muted">Событий нет</p>'}${admin?`<form id="eventForm"><input type="hidden" name="match_id" value="${id}"><div class="grid"><div><label>Игрок</label><select name="player_id" required>${sel(players)}</select></div><div><label>Команда</label><select name="team_id" required>${sel([by(teams,m.team_a),by(teams,m.team_b)])}</select></div><div><label>Событие</label><select name="type"><option value="goal">Гол</option><option value="assist">Передача</option></select></div></div><button class="primary top">Добавить событие</button></form>`:''}</div>`}
function renderLineup(m,tid){const ls=lineups.filter(x=>x.match_id===m.id&&x.team_id===tid);const slots=[{x:50,y:88,pos:'ВР'},{x:25,y:68,pos:'ЗАЩ'},{x:75,y:68,pos:'ЗАЩ'},{x:25,y:40,pos:'ПЗ'},{x:75,y:40,pos:'ПЗ'},{x:50,y:16,pos:'НАП'}];const used=ls.map(x=>x.player_id);return `<div class="card"><h3>${esc(tn(tid))} · ${ls.length}/6</h3><div class="field"><div class="midline"></div>${ls.map((l,i)=>{const slot=slots[i%6];const x=l.field_x==null?slot.x:Number(l.field_x),y=l.field_y==null?slot.y:Number(l.field_y);const img=photo(l.player_id);return `<div class="pitch-player" style="left:${Math.min(95,Math.max(5,x))}%;top:${Math.min(95,Math.max(5,y))}%"><img src="${esc(img||avatar)}" alt=""><span class="name">${esc(pn(l.player_id))}${l.is_mvp?' ⭐':''}</span><span class="rating">${esc(l.position||slot.pos)} · ${l.rating??'—'}</span></div>`}).join('')}</div>${ls.map(l=>`<div class="row between" style="padding:8px 0;border-bottom:1px solid #333"><span>${esc(pn(l.player_id))} · ${esc(l.position||'Игрок')} · ⭐ ${l.rating??'—'} ${l.is_mvp?'🏆 MVP':''}</span>${admin?`<span><button data-act="editlineup" data-id="${l.id}">✎</button> <button data-act="deletelineup" data-id="${l.id}">×</button></span>`:''}</div>`).join('')}${admin&&ls.length<6?`<form class="lineupForm"><input type="hidden" name="match_id" value="${m.id}"><input type="hidden" name="team_id" value="${tid}"><label>Добавить игрока в состав</label><select name="player_id" required>${sel(players.filter(p=>!lineups.some(l=>l.match_id===m.id&&l.player_id===p.id)))}</select><div class="grid"><div><label>Позиция</label><select name="position"><option>ВР</option><option>ЗАЩ</option><option>ПЗ</option><option>НАП</option></select></div><div><label>Оценка (1–10)</label><input name="rating" type="number" min="1" max="10" step="0.1" placeholder="Например 7.5"></div></div><label><input type="checkbox" name="is_mvp" style="width:auto"> MVP</label><button class="primary top">Добавить в состав</button></form>`:''}</div>`}
const avatar='data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#454545"/><circle cx="50" cy="36" r="19" fill="#aaa"/><ellipse cx="50" cy="91" rx="36" ry="31" fill="#aaa"/></svg>');
function photo(pid){const p=photos.find(x=>x.player_id===pid);return p?.photo_path?db.storage.from('v12-player-photos').getPublicUrl(p.photo_path).data.publicUrl:null}
function completed(){const linked=new Set(dayMatches.map(x=>x.match_id));return matches.filter(x=>linked.has(x.id)&&x.status==='finished')}
function renderStats(){const fm=completed(),ids=new Set(fm.map(x=>x.id));const roster=lineups.filter(l=>ids.has(l.match_id));const ranks=players.map(p=>{const own=roster.filter(l=>l.player_id===p.id),goals=events.filter(e=>ids.has(e.match_id)&&e.player_id===p.id&&e.type==='goal').length,assists=events.filter(e=>ids.has(e.match_id)&&e.player_id===p.id&&e.type==='assist').length,ratings=own.map(l=>Number(l.rating)).filter(n=>Number.isFinite(n)&&n>0);return {...p,games:own.length,goals,assists,mvp:own.filter(l=>l.is_mvp).length,avg:ratings.length?(ratings.reduce((a,b)=>a+b,0)/ratings.length).toFixed(2):'—'}}).sort((a,b)=>b.goals-a.goals||b.assists-a.assists);return `<h2>Статистика V12</h2><p class="muted small">Учитываются только завершённые матчи, созданные в новых игровых днях. Старые матчи не учитываются.</p><div class="grid"><div class="metric"><b>${days.length}</b>Игровых дней</div><div class="metric"><b>${fm.length}</b>Матчей</div><div class="metric"><b>${fm.reduce((s,m)=>s+(m.score_a||0)+(m.score_b||0),0)}</b>Голов по счёту</div><div class="metric"><b>${new Set(roster.map(l=>l.player_id)).size}</b>Игроков сыграло</div></div><div class="card scroll"><div class="row between"><h3>Рейтинг игроков</h3><button onclick="window.print()">🖨️ PDF / печать</button></div><table><thead><tr><th>Игрок</th><th>И</th><th>Г</th><th>П</th><th>MVP</th><th>Средняя оценка</th></tr></thead><tbody>${ranks.map(p=>`<tr><td><span class="linklike" data-act="player" data-id="${p.id}">${esc(p.name)}</span></td><td>${p.games}</td><td>${p.goals}</td><td>${p.assists}</td><td>${p.mvp}</td><td>${p.avg}</td></tr>`).join('')}</tbody></table></div>`}
function renderPlayers(){return `<div class="row between"><h2>Игроки</h2>${admin?'<button class="primary" data-act="newplayer">+ Игрок</button>':''}</div>${page?.type==='newplayer'?'':''}<div class="grid">${players.map(p=>`<div class="card" data-act="player" data-id="${p.id}" style="cursor:pointer;text-align:center"><img class="avatar big" src="${esc(photo(p.id)||avatar)}"><h3 style="margin-top:10px">${esc(p.name)}</h3><span class="pill">Открыть карточку</span></div>`).join('')}</div>${!players.length?'<div class="card empty">Пока нет игроков</div>':''}`}
function renderPlayer(id){const p=by(players,id);const done=new Set(completed().map(x=>x.id));const ls=lineups.filter(l=>l.player_id===id&&done.has(l.match_id));const nums=ls.map(l=>Number(l.rating)).filter(n=>n>0);const es=events.filter(e=>e.player_id===id&&done.has(e.match_id));return `<button data-act="players">← Игроки</button><div class="card"><div class="row"><img class="avatar big" src="${esc(photo(id)||avatar)}"><div><h2>${esc(p.name)}</h2><span class="pill">${ls.length} матчей · ${nums.length?(nums.reduce((a,b)=>a+b,0)/nums.length).toFixed(2):'—'} рейтинг</span></div></div>${admin?`<form id="photoForm"><input type="hidden" name="player_id" value="${id}"><label>Фотография игрока (JPG, PNG, WEBP до 5 МБ)</label><input type="file" name="photo" accept="image/jpeg,image/png,image/webp" required><button class="primary top">Загрузить фото</button></form>`:''}</div><div class="grid"><div class="metric"><b>${es.filter(e=>e.type==='goal').length}</b>Голы</div><div class="metric"><b>${es.filter(e=>e.type==='assist').length}</b>Передачи</div><div class="metric"><b>${ls.filter(l=>l.is_mvp).length}</b>MVP</div></div><div class="card scroll"><h3>История оценок</h3><table><tr><th>Дата</th><th>Команда</th><th>Оценка</th><th>MVP</th></tr>${ls.map(l=>{const dm=dayMatches.find(x=>x.match_id===l.match_id);const d=days.find(x=>x.id===dm?.matchday_id);return `<tr><td>${date(d?.play_date)}</td><td>${esc(tn(l.team_id))}</td><td>${l.rating??'—'}</td><td>${l.is_mvp?'🏆':''}</td></tr>`}).join('')}</table></div>`}
function renderAdmin(){if(!user)return `<h2>Вход администратора</h2><div class="card"><form id="loginForm"><label>Email</label><input name="email" type="email" required><label>Пароль</label><input name="password" type="password" required><button class="primary top">Войти</button></form></div>`;if(!admin)return `<h2>Аккаунт</h2><div class="card">Вы вошли как ${esc(user.email)}, но прав администратора нет.<div class="top"><button data-act="logout">Выйти</button></div></div>`;return `<div class="row between"><h2>Панель администратора</h2><button data-act="logout">Выйти</button></div><div class="card"><h3>Добавить игрока</h3><form id="playerForm"><label>Имя игрока</label><input name="name" maxlength="80" required><button class="primary top">Добавить игрока</button></form></div><div class="card"><h3>Добавить команду</h3><form id="teamForm"><label>Название</label><input name="name" required maxlength="60"><label>Цвет</label><select name="color"><option value="green">Зелёный</option><option value="red">Красный</option><option value="blue">Синий</option><option value="yellow">Жёлтый</option><option value="pink">Розовый</option><option value="purple">Фиолетовый</option></select><button class="primary top">Добавить команду</button></form></div><div class="card"><h3>Назначить ещё одного администратора</h3><p class="small muted">Человек должен сначала зарегистрироваться в Supabase Auth. Укажи его User ID (UUID). Назначать администраторов может только владелец, если это разрешено политиками базы.</p><form id="adminForm"><label>User ID из Supabase → Authentication → Users</label><input name="user_id" required placeholder="xxxxxxxx-xxxx-xxxx-xxxx-xxxxxxxxxxxx"><button class="primary top">Назначить администратора</button></form></div><div class="card"><h3>Текущие данные</h3><p class="muted">${teams.length} команд · ${players.length} игроков · ${days.length} новых игровых дней</p><p class="small muted">Старые матчи остаются в базе, но в статистику V12 не попадают.</p></div>`}
async function handleAction(b){const a=b.dataset.act,id=b.dataset.id;if(a==='back'){page=null;tab='days';return render()}if(a==='newday'){page={type:'newday'};return render()}if(a==='day'){page={type:'day',id};tab='days';return render()}if(a==='match'){page={type:'match',id};return render()}if(a==='player'){page={type:'player',id};return render()}if(a==='players'){page=null;tab='players';return render()}if(a==='newplayer'){tab='admin';page=null;return render()}if(a==='logout'){await db.auth.signOut();await auth();return}if(a==='removeteam'){if(!confirm('Убрать команду из игрового дня?'))return;await del('v12_day_teams','id',id);return await load()}if(a==='deletelineup'){if(!confirm('Удалить игрока из состава?'))return;await del('v12_lineups','id',id);return await load()}if(a==='deleteevent'){if(!confirm('Удалить событие?'))return;await del('events','id',id);return await load()}if(a==='editlineup'){const l=lineups.find(x=>x.id===id);if(!l)return;const val=prompt('Оценка игрока (1–10):',l.rating??'7');if(val===null)return;const rating=Number(val.replace(',','.'));if(!Number.isFinite(rating)||rating<1||rating>10)throw Error('Оценка должна быть от 1 до 10');const mvp=confirm('Назначить этого игрока MVP? (ОК = да)');await save('v12_lineups',{rating,is_mvp:mvp},id);return await load()}if(a==='newmatch'){const dt=dayTeams.filter(x=>x.matchday_id===id),ts=dt.map(x=>by(teams,x.team_id));if(ts.length<2)throw Error('Сначала добавь минимум две команды');$('#view').innerHTML=`<h2>Новый матч</h2><div class="card"><form id="matchForm"><input type="hidden" name="matchday_id" value="${id}"><div class="grid"><div><label>Команда 1</label><select name="team_a" required>${sel(ts)}</select></div><div><label>Команда 2</label><select name="team_b" required>${sel(ts)}</select></div><div><label>Голы 1</label><input type="number" name="score_a" min="0" value="0" required></div><div><label>Голы 2</label><input type="number" name="score_b" min="0" value="0" required></div></div><label>Статус</label><select name="status"><option value="live">Идёт игра</option><option value="finished">Завершён</option></select><button class="primary top">Создать матч</button><button type="button" data-act="day" data-id="${id}">Отмена</button></form></div>`;return}}
async function submit(form){const id=form.id,v=Object.fromEntries(new FormData(form));if(id==='loginForm'){const {error}=await db.auth.signInWithPassword({email:v.email,password:v.password});if(error)throw error;await auth();return msg('Вход выполнен')}if(!admin)throw Error('Нет прав администратора');if(id==='dayForm'){const d=await save('v12_matchdays',{play_date:v.play_date,title:v.title,format:v.format});await load();page={type:'day',id:d.id};render();return msg('Игровой день создан')}if(id==='addDayTeam'){await save('v12_day_teams',v);await load();return msg('Команда добавлена')}if(id==='teamForm'){await save('teams',v);await load();return msg('Команда создана')}if(id==='playerForm'){await save('players',v);await load();return msg('Игрок создан')}if(id==='scoreForm'){await save('matches',{score_a:Number(v.score_a),score_b:Number(v.score_b),status:v.status},v.id);await load();return msg('Счёт сохранён')}if(id==='eventForm'){if(!lineups.some(l=>l.match_id===v.match_id&&l.player_id===v.player_id&&l.team_id===v.team_id))throw Error('Игрок должен быть в составе выбранной команды');await save('events',v);await load();return msg('Событие записано')}if(id==='matchForm'){if(v.team_a===v.team_b)throw Error('Выбери разные команды');const d=days.find(x=>x.id===v.matchday_id);const m=await save('matches',{played_at:d.play_date,team_a:v.team_a,team_b:v.team_b,score_a:Number(v.score_a),score_b:Number(v.score_b),status:v.status});try{const order=dayMatches.filter(x=>x.matchday_id===v.matchday_id).length+1;await save('v12_day_matches',{match_id:m.id,matchday_id:v.matchday_id,match_order:order})}catch(e){await del('matches','id',m.id);throw e}await load();page={type:'match',id:m.id};render();return msg('Матч создан')}if(id==='adminForm'){const {data,error}=await db.from('admins').insert({user_id:v.user_id,role:'admin'}).select();if(error)throw error;return msg('Администратор добавлен')}if(id==='photoForm'){const file=form.querySelector('input[type=file]').files[0];if(!file)throw Error('Выбери фотографию');if(!['image/jpeg','image/png','image/webp'].includes(file.type)||file.size>5*1024*1024)throw Error('Только JPG/PNG/WEBP до 5 МБ');const ext=file.type==='image/png'?'png':file.type==='image/webp'?'webp':'jpg',path=`${v.player_id}/${crypto.randomUUID()}.${ext}`;const up=await db.storage.from('v12-player-photos').upload(path,file,{contentType:file.type});if(up.error)throw up.error;const old=photos.find(x=>x.player_id===v.player_id);const {error}=old?await db.from('v12_player_photos').update({photo_path:path,updated_at:new Date().toISOString()}).eq('player_id',v.player_id):await db.from('v12_player_photos').insert({player_id:v.player_id,photo_path:path});if(error){await db.storage.from('v12-player-photos').remove([path]);throw error}if(old?.photo_path)await db.storage.from('v12-player-photos').remove([old.photo_path]);await load();return msg('Фото загружено')}}
async function lineupSubmit(form){if(!admin)throw Error('Нет прав');const v=Object.fromEntries(new FormData(form));if(!v.player_id)throw Error('Выбери игрока');const current=lineups.filter(l=>l.match_id===v.match_id&&l.team_id===v.team_id);if(current.length>=6)throw Error('Максимум 6 игроков');const slots=[{x:50,y:88},{x:25,y:68},{x:75,y:68},{x:25,y:40},{x:75,y:40},{x:50,y:16}],s=slots[current.length];const obj={match_id:v.match_id,team_id:v.team_id,player_id:v.player_id,position:v.position,field_x:s.x,field_y:s.y,is_mvp:!!v.is_mvp};if(v.rating){const r=Number(v.rating);if(r<1||r>10)throw Error('Оценка от 1 до 10');obj.rating=r}await save('v12_lineups',obj);await load();msg('Игрок добавлен в состав')}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;try{await handleAction(b)}catch(err){error(err)}});document.addEventListener('submit',async e=>{if(!e.target.matches('form'))return;e.preventDefault();try{if(e.target.classList.contains('lineupForm'))await lineupSubmit(e.target);else await submit(e.target)}catch(err){error(err)}});document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>nav(b.dataset.tab)));
try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(URL,KEY);await load();await auth();db.auth.onAuthStateChange(()=>setTimeout(()=>auth().catch(error),0))}catch(e){error(e);$('#view').innerHTML='<div class="card">Не удалось загрузить данные. Проверь подключение к Supabase и права чтения таблиц.</div>'}
</script></body></html>
