<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#214d32"><title>V12 — Футбольный журнал</title><style>
:root{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:#18241d;background:#f3f6f4}*{box-sizing:border-box}body{margin:0;padding-bottom:100px}header{background:#214d32;color:#fff;padding:24px 18px;display:flex;align-items:center;gap:14px}header .logo{width:66px;height:66px;border-radius:50%;background:#fff;color:#214d32;display:grid;place-items:center;font-weight:900;font-size:26px;box-shadow:0 2px 6px #0002}header h1{font-size:25px;margin:0}header p{margin:2px 0 0;color:#c2d1c7}header .right{margin-left:auto}button{font:inherit;cursor:pointer;border:0}button.primary{background:#2c653f;color:white;padding:13px 17px;border-radius:16px;font-weight:700}button.secondary{background:#e9f0eb;color:#214d32;padding:11px 14px;border-radius:12px}button.danger{background:#c43e38;color:#fff;padding:10px 13px;border-radius:12px}.wrap{max-width:780px;margin:auto;padding:24px 16px}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}.heading h2{margin:0;font-size:28px}.card{background:#fff;border:1px solid #d9e5dd;border-radius:22px;box-shadow:0 2px 5px #14291b13;padding:22px;margin-bottom:16px}.date{font-size:23px;font-weight:800}.muted{color:#78877e}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.between{justify-content:space-between}.pill{border-radius:100px;padding:7px 12px;display:inline-block;background:#e9f1eb;color:#718176}.team{color:#fff}.green{background:#428344}.red{background:#c8403b}.blue{background:#3978d3}.pink{background:#efbfd0;color:#242424}.yellow{background:#d9aa2d}.purple{background:#7c5ab8}.score{font-size:21px;margin-top:13px}.score strong{font-weight:900}.tag{font-size:13px}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #dbe5dd;display:flex;justify-content:space-around;padding:11px 4px max(12px,env(safe-area-inset-bottom));z-index:5}.nav{background:transparent;color:#75847b;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;padding:3px 5px}.nav .emoji{font-size:25px}.nav.active{color:#24603a;font-weight:800}.hidden{display:none!important}label{display:block;font-weight:650;margin:13px 0 5px}input,select{width:100%;font:inherit;padding:12px;border-radius:12px;border:1px solid #bdcfc2;background:white}form .actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.metric{background:#fff;border-radius:16px;padding:18px;border:1px solid #dce7df}.metric strong{font-size:29px;display:block}.metric span{color:#718176;font-size:13px}table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:11px 5px;border-bottom:1px solid #edf0ed;font-size:14px}th{color:#6d7f71}.notice{padding:12px 14px;background:#fff4db;border-radius:13px;margin-bottom:15px;font-size:14px}.small{font-size:13px}.topspace{margin-top:15px}.error{color:#b82c2c}.success{color:#287c45}.scroll{overflow:auto}.empty{color:#78877e;padding:18px;text-align:center}a{color:#21673e}@media(min-width:650px){header{padding-left:max(24px,calc((100vw - 750px)/2))} .bottom{left:50%;transform:translateX(-50%);max-width:780px;border-radius:18px 18px 0 0}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style></head><body><header><div class="logo">V12</div><div><h1>V12</h1><p>Футбольный журнал</p></div><div class="right"><span id="authStatus" class="small">Просмотр</span></div></header><main class="wrap"><div id="message"></div><section id="games"></section><section id="live" class="hidden"></section><section id="stats" class="hidden"></section><section id="players" class="hidden"></section><section id="admin" class="hidden"></section></main><nav class="bottom" aria-label="Навигация"><button class="nav active" data-tab="games"><span class="emoji">🗓️</span>Игры</button><button class="nav" data-tab="live"><span class="emoji">⚽</span>Текущая</button><button class="nav" data-tab="stats"><span class="emoji">📊</span>Статистика</button><button class="nav" data-tab="players"><span class="emoji">👟</span>Игроки</button><button class="nav" data-tab="admin"><span class="emoji">⚙️</span>Админ</button></nav><script type="module">
// Заполните значения из Supabase → Project Settings → API.
const SUPABASE_URL='https://wrqmxihqfbalciuymlqc.supabase.co';
const SUPABASE_ANON_KEY='sb_publishable_OFoUkkgkJCCzrjI9-IrgTQ_IdTAwUir';
const configured=!!(SUPABASE_URL&&SUPABASE_ANON_KEY);
let db=null,user=null,isAdmin=false,tab='games';
let teams=[{id:'g',name:'Зелёные',color:'green'},{id:'r',name:'Красные',color:'red'},{id:'b',name:'Синие',color:'blue'},{id:'p',name:'Гламурные',color:'pink'}];
let players=[{id:'1',name:'Александр'},{id:'2',name:'Максим'},{id:'3',name:'Даниил'}];
let matches=[{id:'m1',played_at:'2026-10-29',team_a:'g',team_b:'r',score_a:22,score_b:13,status:'finished'},{id:'m2',played_at:'2026-10-27',team_a:'r',team_b:'b',score_a:24,score_b:17,status:'finished'},{id:'m3',played_at:'2026-10-25',team_a:'p',team_b:'r',score_a:21,score_b:13,status:'finished'}];
let events=[{id:'e1',match_id:'m1',player_id:'1',team_id:'g',type:'goal'},{id:'e2',match_id:'m1',player_id:'2',team_id:'g',type:'assist'}];
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t=id=>teams.find(x=>x.id===id)||{name:'Неизвестно',color:'green'};const p=id=>players.find(x=>x.id===id)||{name:'Неизвестно'};
const fmt=s=>new Date(s+'T12:00:00').toLocaleDateString('ru-RU',{day:'2-digit',month:'2-digit',year:'numeric',weekday:'short'});
const teamTag=id=>`<span class="pill team ${esc(t(id).color)}">${esc(t(id).name)}</span>`;
function notice(s,error=false){$('message').innerHTML=`<div class="notice ${error?'error':''}">${esc(s)}</div>`;setTimeout(()=>$('message').replaceChildren(),6000)}
function setTab(next){tab=next;document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!==tab));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));render()}
document.querySelectorAll('.nav').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
const opts=(arr,selected)=>arr.map(x=>`<option value="${esc(x.id)}" ${x.id===selected?'selected':''}>${esc(x.name)}</option>`).join('');
function render(){
 $('authStatus').textContent=isAdmin?'Администратор':configured?'Просмотр':'Демо';
 $('games').innerHTML=`<div class="heading"><h2>Игровые дни</h2>${isAdmin?'<button class="primary" data-action="newmatch">+ Новая игра</button>':''}</div>${matches.length?matches.slice().sort((a,b)=>b.played_at.localeCompare(a.played_at)).map(m=>`<article class="card"><div class="row between"><span class="date">${fmt(m.played_at)}</span><span class="pill tag">${m.status==='live'?'идёт игра':'завершено'}</span></div><div class="row topspace">${teamTag(m.team_a)} ${teamTag(m.team_b)}</div><div class="score">${esc(t(m.team_a).name)} <strong>${m.score_a} : ${m.score_b}</strong> ${esc(t(m.team_b).name)}</div>${isAdmin?`<div class="topspace"><button class="secondary" data-action="editmatch" data-id="${esc(m.id)}">Изменить</button></div>`:''}</article>`).join(''):'<div class="card empty">Пока нет игр</div>'}`;
 const live=matches.find(m=>m.status==='live');$('live').innerHTML=`<div class="heading"><h2>Текущая игра</h2></div>${live?`<div class="card"><div class="row">${teamTag(live.team_a)} ${teamTag(live.team_b)}</div><div class="score"><strong>${live.score_a} : ${live.score_b}</strong></div>${isAdmin?`<button class="primary topspace" data-action="editmatch" data-id="${esc(live.id)}">Обновить счёт</button>`:''}</div>`:'<div class="card empty">Сейчас нет активной игры</div>'}`;
 const finished=matches.filter(m=>m.status==='finished');const standings=teams.map(team=>{let played=0,wins=0,draws=0,scored=0,conceded=0;for(const m of finished){if(m.team_a!==team.id&&m.team_b!==team.id)continue;played++;let a=m.team_a===team.id;let gf=a?m.score_a:m.score_b,ga=a?m.score_b:m.score_a;scored+=gf;conceded+=ga;if(gf>ga)wins++;if(gf===ga)draws++}return {...team,played,wins,draws,scored,conceded,points:wins*3+draws}}).sort((a,b)=>b.points-a.points||b.scored-b.conceded-(a.scored-a.conceded));
 $('stats').innerHTML=`<div class="heading"><h2>Статистика</h2></div><div class="grid"><div class="metric"><strong>${finished.length}</strong><span>Матчей</span></div><div class="metric"><strong>${finished.reduce((n,m)=>n+m.score_a+m.score_b,0)}</strong><span>Голов по счёту</span></div><div class="metric"><strong>${teams.length}</strong><span>Команд</span></div><div class="metric"><strong>${players.length}</strong><span>Игроков</span></div></div><div class="card topspace scroll"><h3>Таблица команд</h3><table><thead><tr><th>Команда</th><th>И</th><th>В</th><th>Н</th><th>ЗМ</th><th>ПМ</th><th>О</th></tr></thead><tbody>${standings.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.played}</td><td>${x.wins}</td><td>${x.draws}</td><td>${x.scored}</td><td>${x.conceded}</td><td><b>${x.points}</b></td></tr>`).join('')}</tbody></table><p class="small muted">О = 3 очка за победу, 1 за ничью.</p></div>`;
 const ranks=players.map(x=>({...x,goals:events.filter(e=>e.player_id===x.id&&e.type==='goal').length,assists:events.filter(e=>e.player_id===x.id&&e.type==='assist').length})).sort((a,b)=>b.goals-a.goals||b.assists-a.assists);
 $('players').innerHTML=`<div class="heading"><h2>Игроки</h2>${isAdmin?'<button class="primary" data-action="newplayer">+ Игрок</button>':''}</div><div class="card scroll"><table><thead><tr><th>Игрок</th><th>⚽ Голы</th><th>🅰️ Передачи</th></tr></thead><tbody>${ranks.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.goals}</td><td>${x.assists}</td></tr>`).join('')}</tbody></table></div>`;
 renderAdmin();
}
function renderAdmin(){if(!configured){$('admin').innerHTML=`<h2>Настройка V12</h2><div class="notice">Демо-режим. Данные примера не сохраняются на сервере. Для общего доступа настройте Supabase по инструкции README.md.</div><div class="card"><p>После настройки здесь появится вход администратора.</p></div>`;return}if(!user){$('admin').innerHTML=`<h2>Вход администратора</h2><div class="card"><form id="login"><label>Email</label><input name="email" type="email" required><label>Пароль</label><input name="password" type="password" required><div class="actions"><button class="primary">Войти</button></div></form></div>`;return}if(!isAdmin){$('admin').innerHTML=`<h2>Профиль</h2><div class="card">Вы вошли как ${esc(user.email)}, но у вас нет прав администратора.<div class="topspace"><button class="secondary" data-action="logout">Выйти</button></div></div>`;return} $('admin').innerHTML=`<div class="heading"><h2>Управление</h2><button class="secondary" data-action="logout">Выйти</button></div><div class="card"><h3>Команды</h3><form id="teamForm"><label>Название новой команды</label><input name="name" required maxlength="60"><label>Цвет</label><select name="color"><option value="green">Зелёный</option><option value="red">Красный</option><option value="blue">Синий</option><option value="pink">Розовый</option><option value="yellow">Жёлтый</option><option value="purple">Фиолетовый</option></select><div class="actions"><button class="primary">Добавить команду</button></div></form></div><div class="card"><h3>Записать гол или передачу</h3><form id="eventForm"><label>Матч</label><select name="match_id" required>${matches.map(m=>`<option value="${esc(m.id)}">${fmt(m.played_at)} — ${esc(t(m.team_a).name)} / ${esc(t(m.team_b).name)}</option>`).join('')}</select><label>Игрок</label><select name="player_id" required>${opts(players)}</select><label>Команда игрока</label><select name="team_id" required>${opts(teams)}</select><label>Действие</label><select name="type"><option value="goal">Гол</option><option value="assist">Голевая передача</option></select><div class="actions"><button class="primary">Записать</button></div></form><p class="small muted">Голы и передачи учитываются отдельно от итогового счёта матча.</p></div>`}
function matchForm(m){const editing=!!m;const selectedA=m?.team_a||teams[0]?.id,selectedB=m?.team_b||teams[1]?.id;const html=`<div class="heading"><h2>${editing?'Изменить матч':'Новая игра'}</h2><button class="secondary" data-action="cancel">Отмена</button></div><div class="card"><form id="matchForm"><label>Дата</label><input type="date" name="played_at" value="${m?.played_at||new Date().toLocaleDateString('en-CA')}" required><label>Команда 1</label><select name="team_a">${opts(teams,selectedA)}</select><label>Команда 2</label><select name="team_b">${opts(teams,selectedB)}</select><label>Счёт команды 1</label><input name="score_a" type="number" min="0" max="999" value="${m?.score_a??0}" required><label>Счёт команды 2</label><input name="score_b" type="number" min="0" max="999" value="${m?.score_b??0}" required><label>Статус</label><select name="status"><option value="finished" ${m?.status!=='live'?'selected':''}>Завершено</option><option value="live" ${m?.status==='live'?'selected':''}>Идёт игра</option></select><div class="actions"><button class="primary">Сохранить</button>${editing?'<button type="button" class="danger" data-action="deletematch" data-id="'+esc(m.id)+'">Удалить матч</button>':''}</div></form></div>`;$('games').innerHTML=html;setTabForm();$('matchForm').addEventListener('submit',async e=>{e.preventDefault();const v=Object.fromEntries(new FormData(e.target));if(v.team_a===v.team_b)return notice('Выберите две разные команды',true);v.score_a=Number(v.score_a);v.score_b=Number(v.score_b);try{if(editing)await write('matches','update',v,m.id);else await write('matches','insert',v);await refresh();setTab('games');notice('Матч сохранён')}catch(err){notice(err.message,true)}})}
function setTabForm(){tab='games';document.querySelectorAll('main section').forEach(s=>s.classList.toggle('hidden',s.id!=='games'));document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.tab==='games'))}
async function write(table,action,value,id){if(!isAdmin)throw Error('Нет прав администратора');let q=db.from(table);let res=action==='insert'?await q.insert(value):action==='update'?await q.update(value).eq('id',id):await q.delete().eq('id',id);if(res.error)throw res.error}
async function refresh(){if(!db)return;const tables=['teams','players','matches','events'];const results=await Promise.all(tables.map(name=>db.from(name).select('*')));const failure=results.find(r=>r.error);if(failure)throw failure.error;[teams,players,matches,events]=results.map(r=>r.data);render()}
async function authRefresh(){if(!db)return;const {data:{user:u}}=await db.auth.getUser();user=u;isAdmin=false;if(user){const r=await db.from('admins').select('user_id').eq('user_id',user.id).maybeSingle();isAdmin=!!r.data}render()}
document.addEventListener('click',async e=>{const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;try{if(action==='newmatch'&&isAdmin)return matchForm(null);if(action==='editmatch'&&isAdmin)return matchForm(matches.find(m=>m.id===b.dataset.id));if(action==='cancel')return setTab('games');if(action==='newplayer'&&isAdmin){$('players').innerHTML=`<div class="heading"><h2>Добавить игрока</h2><button class="secondary" data-action="backplayers">Назад</button></div><div class="card"><form id="playerForm"><label>Имя игрока</label><input name="name" maxlength="80" required><div class="actions"><button class="primary">Добавить</button></div></form></div>`;return}if(action==='backplayers')return render();if(action==='logout'){await db.auth.signOut();await authRefresh();return}if(action==='deletematch'&&isAdmin&&confirm('Удалить матч и связанные события?')){await write('matches','delete',null,b.dataset.id);await refresh();setTab('games')}}catch(err){notice(err.message,true)}});
document.addEventListener('submit',async e=>{if(!['login','teamForm','eventForm','playerForm'].includes(e.target.id))return;e.preventDefault();const id=e.target.id,v=Object.fromEntries(new FormData(e.target));try{if(id==='login'){const {error}=await db.auth.signInWithPassword(v);if(error)throw error;await authRefresh();notice('Вход выполнен');return}if(!isAdmin)throw Error('Нет прав');if(id==='teamForm')await write('teams','insert',v);if(id==='eventForm')await write('events','insert',v);if(id==='playerForm')await write('players','insert',v);await refresh();notice('Сохранено')}catch(err){notice(err.message,true)}});
if(configured){try{const {createClient}=await import('https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm');db=createClient(SUPABASE_URL,SUPABASE_ANON_KEY);await refresh();await authRefresh();db.auth.onAuthStateChange(()=>setTimeout(authRefresh,0))}catch(err){notice('Ошибка подключения: '+err.message,true)}}render();
</script></body></html>
